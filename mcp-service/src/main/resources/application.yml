server:
  port: 8090

spring:
  application:
    name: mcp-service
  cloud:
    inetutils:
      ignored-interfaces:
        - ecs-eth0
      preferred-networks:
        - 10.0
  ai:
    mcp:
      server:
        name: food-delivery-mcp
        version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    eureka:
      enabled: false

jwt:
  secret: ${JWT_SECRET}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:discovery-server}:8761/eureka/

# Downstream service base URLs (Docker defaults; override locally)
mcp:
  clients:
    order-service-url: ${ORDER_SERVICE_URL:http://localhost:8080}
    customer-service-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
    delivery-service-url: ${DELIVERY_SERVICE_URL:http://localhost:8083}
    restaurant-service-url: ${RESTAURANT_SERVICE_URL:http://localhost:8082}
    connect-timeout-seconds: ${MCP_CONNECT_TIMEOUT:5}
    read-timeout-seconds: ${MCP_READ_TIMEOUT:10}

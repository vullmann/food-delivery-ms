services:
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg

  discovery-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    restart: on-failure

  customer-service:
    build:
      context: ./customer-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres-customer
      DB_PORT: 5432
      DB_NAME: customerdb
      SPRING_DATASOURCE_USERNAME: customer
      SPRING_DATASOURCE_PASSWORD: customer
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres-customer
      - kafka
      - discovery-server
    restart: on-failure

  postgres-customer:
    image: postgres:16
    environment:
      POSTGRES_DB: customerdb
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer
    ports:
      - "5434:5432"
    volumes:
      - postgres-customer-data:/var/lib/postgresql/data

  restaurant-service:
    build:
      context: ./restaurant-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres-restaurant
      DB_PORT: 5432
      DB_NAME: restaurantdb
      SPRING_DATASOURCE_USERNAME: restaurant
      SPRING_DATASOURCE_PASSWORD: restaurant
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres-restaurant
      - kafka
      - discovery-server
    restart: on-failure

  postgres-restaurant:
    image: postgres:16
    environment:
      POSTGRES_DB: restaurantdb
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
    ports:
      - "5435:5432"
    volumes:
      - postgres-restaurant-data:/var/lib/postgresql/data

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres-order
      DB_PORT: 5432
      DB_NAME: orderdb
      SPRING_DATASOURCE_USERNAME: orderuser
      SPRING_DATASOURCE_PASSWORD: order
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres-order
      - kafka
      - discovery-server
    restart: on-failure

  postgres-order:
    image: postgres:16
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    ports:
      - "5433:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data

  delivery-service:
    build:
      context: ./delivery-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres-delivery
      DB_PORT: 5432
      DB_NAME: deliverydb
      SPRING_DATASOURCE_USERNAME: delivery
      SPRING_DATASOURCE_PASSWORD: delivery
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres-delivery
      - kafka
      - discovery-server
    restart: on-failure

  postgres-delivery:
    image: postgres:16
    environment:
      POSTGRES_DB: deliverydb
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
    ports:
      - "5436:5432"
    volumes:
      - postgres-delivery-data:/var/lib/postgresql/data

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres-auth
      DB_PORT: 5432
      DB_NAME: authdb
      SPRING_DATASOURCE_USERNAME: auth
      SPRING_DATASOURCE_PASSWORD: auth
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres-auth
      - kafka
      - discovery-server
    restart: on-failure

  postgres-auth:
    image: postgres:16
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5437:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data

  mcp-service:
    build:
      context: ./mcp-service
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      ORDER_SERVICE_URL: http://order-service:8080
      CUSTOMER_SERVICE_URL: http://customer-service:8081
      DELIVERY_SERVICE_URL: http://delivery-service:8083
      RESTAURANT_SERVICE_URL: http://restaurant-service:8082
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - order-service
      - customer-service
      - delivery-service
      - restaurant-service
      - discovery-server
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8090/actuator/health | grep -q UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 3m

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8088:8088"
    environment:
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - discovery-server
    restart: on-failure

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    ports:
      - "8087:8087"
    environment:
      DB_HOST: postgres-notification
      DB_PORT: 5432
      DB_NAME: notificationdb
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_FROM: "whatsapp:+14155238886"
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres-notification
      - kafka
      - discovery-server
    restart: on-failure

  postgres-notification:
    image: postgres:16
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "5438:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data

  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_AI_MCP_CLIENT_SSE_CONNECTIONS_FOOD-DELIVERY-MCP_URL: http://mcp-service:8090
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mcp-service:
        condition: service_healthy
      discovery-server:
        condition: service_started
    restart: on-failure

volumes:
  postgres-order-data:
  postgres-customer-data:
  postgres-restaurant-data:
  postgres-delivery-data:
  postgres-auth-data:
  postgres-notification-data:
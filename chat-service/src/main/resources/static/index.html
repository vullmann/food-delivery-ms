<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FoodDelivery Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* ── Login screen ─────────────────────────────────────────────────────────── */
    .login-container {
      width: 360px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .login-header {
      background: #ff6b35;
      color: #fff;
      padding: 24px 24px 20px;
      text-align: center;
    }

    .login-header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .login-header p  { font-size: 13px; opacity: .85; }

    .login-body { padding: 24px; display: flex; flex-direction: column; gap: 14px; }

    .login-body label { font-size: 13px; font-weight: 600; color: #374151; display: block; margin-bottom: 4px; }

    .login-body input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }

    .login-body input:focus { border-color: #ff6b35; }

    .login-btn {
      width: 100%;
      padding: 11px;
      background: #ff6b35;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      margin-top: 4px;
    }

    .login-btn:hover { background: #e55a25; }
    .login-btn:disabled { background: #ccc; cursor: not-allowed; }

    .login-error {
      font-size: 13px;
      color: #ef4444;
      text-align: center;
      min-height: 18px;
    }

    /* ── Chat screen ─────────────────────────────────────────────────────────── */
    .chat-container {
      width: 420px;
      height: 640px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #ff6b35;
      color: #fff;
      padding: 18px 20px;
      font-size: 17px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-header .dot {
      width: 10px; height: 10px;
      background: #4ade80;
      border-radius: 50%;
    }

    .chat-header .logout-btn {
      margin-left: auto;
      background: rgba(255,255,255,.2);
      border: none;
      color: #fff;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
    }

    .chat-header .logout-btn:hover { background: rgba(255,255,255,.35); }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.bot {
      background: #f0f2f5;
      color: #1a1a1a;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.user {
      background: #ff6b35;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .message.thinking {
      background: #f0f2f5;
      color: #999;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      font-style: italic;
    }

    .input-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #eee;
      align-items: center;
    }

    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus { border-color: #ff6b35; }
    .input-row input.listening { border-color: #ef4444; background: #fff5f5; }

    .btn {
      background: #ff6b35;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 40px; height: 40px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .btn:hover { background: #e55a25; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }

    .btn.recording {
      background: #ef4444;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.12); }
    }

    .no-speech-note {
      font-size: 11px;
      color: #aaa;
      text-align: center;
      padding: 4px 16px 8px;
    }
  </style>
</head>
<body>

<!-- ── Login ─────────────────────────────────────────────────────────────────── -->
<div class="login-container" id="loginScreen">
  <div class="login-header">
    <h1>FoodDelivery</h1>
    <p>Sign in to chat with your assistant</p>
  </div>
  <div class="login-body">
    <div>
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div>
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" id="loginBtn" onclick="login()">Sign in</button>
  </div>
</div>

<!-- ── Chat ──────────────────────────────────────────────────────────────────── -->
<div class="chat-container" id="chatScreen" style="display:none;">
  <div class="chat-header">
    <div class="dot"></div>
    FoodDelivery Assistant
    <button class="logout-btn" onclick="logout()">Sign out</button>
  </div>
  <div class="messages" id="messages">
    <div class="message bot">Hi! I'm your FoodDelivery assistant. Ask me about your orders.</div>
  </div>
  <div class="input-row">
    <input id="input" type="text" placeholder="Speak or type…" autocomplete="off"/>
    <button class="btn" id="micBtn" title="Hold to speak">🎤</button>
    <button class="btn" id="sendBtn" title="Send" onclick="sendMessage()">➤</button>
  </div>
  <div class="no-speech-note" id="speechNote"></div>
</div>

<script>
  const AUTH_URL = 'http://localhost:8084';
  const CHAT_URL = 'http://localhost:8085';

  let sessionId = null;
  let jwtToken  = sessionStorage.getItem('jwt') || null;

  // Restore session if token still stored
  if (jwtToken) showChat();

  // ── Login ──────────────────────────────────────────────────────────────────
  document.getElementById('loginPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  async function login() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorEl  = document.getElementById('loginError');
    const btn      = document.getElementById('loginBtn');

    errorEl.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Signing in…';

    try {
      const res = await fetch(`${AUTH_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        errorEl.textContent = err.detail || 'Invalid email or password.';
        return;
      }

      const data = await res.json();
      jwtToken = data.token;
      sessionStorage.setItem('jwt', jwtToken);
      showChat();
    } catch {
      errorEl.textContent = 'Could not reach the auth service. Is it running?';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  }

  function showChat() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('chatScreen').style.display  = 'flex';
    document.getElementById('input').focus();
  }

  function logout() {
    jwtToken = null;
    sessionId = null;
    sessionStorage.removeItem('jwt');
    document.getElementById('messages').innerHTML =
      '<div class="message bot">Hi! I\'m your FoodDelivery assistant. Ask me about your orders.</div>';
    document.getElementById('chatScreen').style.display  = 'none';
    document.getElementById('loginScreen').style.display = 'block';
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginError').textContent = '';
  }

  // ── Speech Recognition ─────────────────────────────────────────────────────
  let recognition = null;
  let listening   = false;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = true;
    recognition.continuous = false;

    recognition.onstart = () => {
      listening = true;
      document.getElementById('micBtn').classList.add('recording');
      document.getElementById('input').classList.add('listening');
      document.getElementById('input').placeholder = 'Listening…';
    };

    recognition.onresult = (event) => {
      const transcript = Array.from(event.results).map(r => r[0].transcript).join('');
      document.getElementById('input').value = transcript;
      if (event.results[event.results.length - 1].isFinal) {
        stopListening();
        sendMessage();
      }
    };

    recognition.onerror = (event) => {
      stopListening();
      if (event.error !== 'no-speech') {
        document.getElementById('speechNote').textContent = `Mic error: ${event.error}`;
      }
    };

    recognition.onend = () => stopListening();

    document.getElementById('micBtn').addEventListener('click', () => {
      if (listening) { recognition.stop(); }
      else {
        document.getElementById('input').value = '';
        document.getElementById('speechNote').textContent = '';
        recognition.start();
      }
    });
  } else {
    document.getElementById('micBtn').disabled = true;
    document.getElementById('speechNote').textContent =
      'Speech recognition not supported in this browser (use Chrome or Edge).';
  }

  function stopListening() {
    listening = false;
    document.getElementById('micBtn').classList.remove('recording');
    document.getElementById('input').classList.remove('listening');
    document.getElementById('input').placeholder = 'Speak or type…';
  }

  // ── Chat ───────────────────────────────────────────────────────────────────
  document.getElementById('input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });

  function addMessage(text, type) {
    const messagesEl = document.getElementById('messages');
    const el = document.createElement('div');
    el.className = `message ${type}`;
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  async function sendMessage() {
    const inputEl  = document.getElementById('input');
    const sendBtn  = document.getElementById('sendBtn');
    const micBtn   = document.getElementById('micBtn');
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    sendBtn.disabled = true;
    micBtn.disabled  = true;
    addMessage(text, 'user');
    const thinking = addMessage('Thinking…', 'thinking');

    try {
      const res = await fetch(`${CHAT_URL}/chat`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${jwtToken}`
        },
        body: JSON.stringify({ sessionId, message: text })
      });

      if (res.status === 401) {
        thinking.remove();
        addMessage('Your session has expired. Please sign in again.', 'bot');
        logout();
        return;
      }

      if (!res.ok) {
        thinking.remove();
        addMessage(`Error: ${res.status} – ${res.statusText}`, 'bot');
        return;
      }

      const data = await res.json();
      sessionId = data.sessionId;
      thinking.remove();
      addMessage(data.reply, 'bot');
    } catch {
      thinking.remove();
      addMessage('Something went wrong. Please try again.', 'bot');
    } finally {
      sendBtn.disabled = false;
      micBtn.disabled  = false;
      inputEl.focus();
    }
  }
</script>
</body>
</html>

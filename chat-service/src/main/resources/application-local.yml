# -------------------------------------------------------
# Local profile: Gemini via Google AI Studio
# -------------------------------------------------------
spring:
  cloud:
    aws:
      region:
        static: eu-central-1
  ai:
    mcp:
      client:
        sse:
          connections:
            food-delivery-mcp:
              url: http://localhost:8090
    google:
      genai:
        api-key: ${GOOGLE_AI_API_KEY}

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG

server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false   # the server registers itself with nobody
    fetch-registry: false         # server does not fetch a registry from another eureka
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/